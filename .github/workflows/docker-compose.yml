version: '3.8'

services:
  devops-app:
    build: .
    container_name: devopsblog123
    ports:
      - "8030:3000"
    volumes:
      # Mount host Docker socket to grant container read access to Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=8030
      - NODE_ENV=production
    restart: unless-stopped